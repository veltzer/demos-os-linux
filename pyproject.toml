[project]
name = "demos-os-linux"
version = "0.0.0"
requires-python = ">=3.14"
dependencies = [
    "pymakehelper",
    # scripts/cc_project.py and scripts/linux_module.py read their yaml manifests
    "pyyaml",
]

[dependency-groups]
dev = [
    "pyrefly",
    "pytest",
    "ruff",
    "types-pyyaml",
]

[tool.uv]
# Demo/teaching repo: not an installable package.
package = false

[tool.pyrefly]
# Type checking (rsconstruct's pyrefly processor), with pyrefly's default
# error set. "." on the search path is mypy's implicit current directory.
# Warnings fail the check like errors (pyrefly lets them pass by default).
min-severity = "warn"
search-path = [
    "src",
    "scripts",
    ".",
]

[tool.pyrefly.errors]
implicit-any-attribute = "error"
instance-var-assign = "error"
method-assign = "error"
no-any-return = "error"
possibly-uninitialized-attribute = "error"
