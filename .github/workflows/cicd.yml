name: build
on:
  push:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  # The build job below resolves the container image when it starts, so a push
  # that changes the image inputs must republish `latest` before the build pulls
  # it - otherwise we silently run against a stale rsconstruct. Keeping both jobs
  # in one workflow makes that a plain `needs:` instead of polling for the run of
  # a separate workflow.
  image:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 2
      - name: check whether the image inputs changed
        id: changed
        run: |
          # First commit on a branch (or a forced push with no usable parent):
          # rebuild rather than risk pulling a stale image.
          if ! git rev-parse --verify -q HEAD~1 >/dev/null; then
            echo "result=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if git diff --quiet HEAD~1 HEAD -- Dockerfile rsconstruct.toml .github/workflows/cicd.yml; then
            echo "result=false" >> "$GITHUB_OUTPUT"
          else
            echo "result=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: docker/setup-buildx-action@v3
        if: steps.changed.outputs.result == 'true'
      - uses: docker/login-action@v3
        if: steps.changed.outputs.result == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        if: steps.changed.outputs.result == 'true'
        with:
          context: .
          push: true
          tags: ghcr.io/veltzer/demos-os-linux-ci:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            CACHEBUST=${{ github.run_id }}

  build:
    needs: image
    runs-on: ubuntu-24.04
    container:
      image: ghcr.io/veltzer/demos-os-linux-ci:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
    - name: rsconstruct version
      run: rsconstruct version
    - name: trust the workspace dir
      # Container runs as root; checkout dir is owned by the runner user.
      # Modern git refuses to operate on a tree owned by a different uid
      # ("dubious ownership"). Mark all dirs safe inside the container.
      run: git config --global --add safe.directory '*'
    - uses: actions/checkout@v6
    - uses: actions/cache@v5
      with:
        path: .rsconstruct
        key: rsconstruct-${{ runner.os }}-${{ github.run_id }}
        restore-keys: |
          rsconstruct-${{ runner.os }}-
    - name: install language tools
      run: rsconstruct tools install
    - name: build
      # linux_module is excluded in CI: it builds against /lib/modules/$(uname -r)/build
      # which doesn't exist inside a container (no matching kernel headers for the host's
      # azure kernel). Run those demos on a real host.
      run: rsconstruct build -x linux_module
    - name: status
      run: rsconstruct status
