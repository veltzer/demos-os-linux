# Deliberately NOT the fleet's shared build.yml (rsmultigit check same skips
# this repo because the file is named cicd.yml). The demos here need a large
# native toolchain - pinned gcc-15/g++-15, clang against that gcc tree, kernel
# and multimedia dev libraries (see Dockerfile) - that would take most of the
# run to apt-install on a bare runner. So the `image` job publishes that
# toolchain as a container image to ghcr.io (rebuilt only when its inputs
# change) and the `build` job runs rsconstruct inside it. Everything below
# that differs from build.yml exists to serve that two-job shape.
name: build
on:
  push:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Read-only by default; each job below asks for what it needs.
permissions:
  contents: read  # check out the repository

jobs:
  # The build job below resolves the container image when it starts, so a push
  # that changes the image inputs must republish before the build pulls it -
  # otherwise we silently run against a stale rsconstruct. Keeping both jobs in
  # one workflow makes that a plain `needs:` instead of polling for the run of a
  # separate workflow, and lets this job hand the build job an exact image ref
  # rather than a mutable tag both sides have to agree on.
  image:
    name: image
    runs-on: ubuntu-26.04
    permissions:
      contents: read  # check out the repository
      packages: write  # publish the toolchain image to ghcr.io
    outputs:
      image: ${{ steps.ref.outputs.image }}
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history: the change check below diffs across the whole push
          # range, which can be many commits deep.
          fetch-depth: 0
          persist-credentials: false
      - name: resolve the image tag for this run
        id: tag
        # `latest` is mutable, so re-running an old workflow would pull today's
        # image rather than the one the run originally used. Every build also
        # gets an immutable run-scoped tag, and the build job consumes that one.
        run: |
          echo "immutable=ghcr.io/veltzer/demos-os-linux-ci:run-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_OUTPUT"
      - name: check whether the image inputs changed
        id: changed
        # Expressions reach the script as environment variables, never pasted
        # into its text, where a value would be read as shell.
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          # Rebuild unconditionally when we cannot establish a trustworthy base
          # to diff against: a scheduled/dispatch run (no push range), the first
          # commit on a branch, or a force-push whose `before` is gone.
          rebuild() { echo "result=true" >> "$GITHUB_OUTPUT"; exit 0; }

          before="${BEFORE}"
          if [ "${GITHUB_EVENT_NAME}" != push ]; then
            rebuild
          fi
          # All-zero `before` means a newly created branch or tag.
          case "$before" in
            ''|0000000000000000000000000000000000000000) rebuild ;;
          esac
          git rev-parse --verify -q "$before^{commit}" >/dev/null || rebuild

          # Diff the whole push range, not just the tip commit: a push of
          # several commits can change the image inputs in any one of them.
          if git diff --quiet "$before" "${GITHUB_SHA}" -- Dockerfile rsconstruct.toml rsconstruct.lock pyproject.toml uv.lock .github/workflows/cicd.yml; then
            echo "result=false" >> "$GITHUB_OUTPUT"
          else
            echo "result=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        if: steps.changed.outputs.result == 'true'
      # Unconditional: an unchanged image still needs its digest looked up.
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        id: push
        if: steps.changed.outputs.result == 'true'
        with:
          context: .
          push: true
          # Both tags point at the same digest. `latest` is what a fresh clone
          # or a sibling tool reaches for; the run-scoped tag is what makes an
          # old run re-runnable against the image it actually used.
          tags: |
            ghcr.io/veltzer/demos-os-linux-ci:latest
            ${{ steps.tag.outputs.immutable }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            CACHEBUST=${{ github.run_id }}
      - name: publish the image ref for the build job
        id: ref
        # The build job gets the image by digest, never by tag: `latest` is
        # shared by every branch, so a push elsewhere could republish it
        # between this job and the build job. When something changed, the
        # digest is the one just pushed; when nothing did, it is what
        # `latest` names right now.
        env:
          CHANGED: ${{ steps.changed.outputs.result }}
          PUSHED: ${{ steps.push.outputs.digest }}
        run: |
          if [ "$CHANGED" = true ]; then
            digest=$PUSHED
          else
            digest=$(docker buildx imagetools inspect ghcr.io/veltzer/demos-os-linux-ci:latest --format '{{json .Manifest}}' | jq -r .digest)
          fi
          case "$digest" in
            sha256:*) ;;
            *) echo "no image digest (got '$digest')" >&2; exit 1 ;;
          esac
          echo "image=ghcr.io/veltzer/demos-os-linux-ci@$digest" >> "$GITHUB_OUTPUT"

  build:
    name: build
    needs: image
    runs-on: ubuntu-26.04
    permissions:
      contents: read  # check out the repository
      packages: read  # pull the toolchain image from ghcr.io
    container:
      # Pinned by digest, which the image job above resolves at run time (the
      # image it just pushed, or what `latest` named when the image inputs did
      # not change). zizmor cannot see a digest through the expression.
      image: ${{ needs.image.outputs.image }} # zizmor: ignore[unpinned-images]
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
      # rsconstruct runs every tool under bwrap, which makes mount and network
      # namespaces and an overlay mount. The container runs as root, so bwrap
      # uses real capabilities rather than a user namespace. Each option below
      # is needed; without it bwrap fails as noted (tested 2026-11-20):
      #   SYS_ADMIN            Creating new namespace failed: Operation not permitted
      #   NET_ADMIN            loopback: Failed RTM_NEWADDR (setting up --unshare-net)
      #   seccomp=unconfined   pivot_root: Operation not permitted
      #   apparmor=unconfined  Failed to make / slave: Permission denied
      options: >-
        --cap-add SYS_ADMIN
        --cap-add NET_ADMIN
        --security-opt seccomp=unconfined
        --security-opt apparmor=unconfined
    steps:
    - name: rsconstruct version
      run: rsconstruct version
    - name: trust the workspace dir
      # Container runs as root; checkout dir is owned by the runner user.
      # Modern git refuses to operate on a tree owned by a different uid
      # ("dubious ownership"). Mark all dirs safe inside the container.
      run: git config --global --add safe.directory '*'
    - uses: actions/checkout@v7
      with:
        # The terms check reads shared/shared-terms, a submodule. Without
        # this the directory checks out empty and the check passes on
        # nothing; same setting as the shared build.yml.
        submodules: recursive
        persist-credentials: false
    - uses: actions/cache@v6
      with:
        path: .rsconstruct
        key: rsconstruct-${{ runner.os }}-${{ github.run_id }}
        restore-keys: |
          rsconstruct-${{ runner.os }}-
    - name: install project tools
      run: rsconstruct tool install project
    - name: build
      # linux_module is excluded in CI: it builds against /lib/modules/$(uname -r)/build
      # which doesn't exist inside a container (no matching kernel headers for the host's
      # azure kernel). Run those demos on a real host.
      run: rsconstruct build -x processor.mass_generator.generic.linux_module
    - name: status
      run: rsconstruct status
