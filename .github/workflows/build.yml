name: build
on: push

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  pages: write
  id-token: write
  packages: read
  # needed by wait-for-image to query the image workflow's run status
  actions: read

jobs:
  # The container image below is resolved when this job starts, so if the same
  # push also rebuilds the image (image.yml triggers on Dockerfile /
  # rsconstruct.toml), we would silently run against the previous `latest` and
  # get a stale rsconstruct. Wait for that run to publish before pulling.
  wait-for-image:
    runs-on: ubuntu-24.04
    steps:
    - name: wait for the image workflow on this commit
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        for _ in $(seq 60); do
          status=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow image.yml \
            --commit "$GITHUB_SHA" --json status,conclusion \
            --jq '.[0] | select(.) | .status + " " + (.conclusion // "")')
          # No image run for this commit: the image is unchanged, `latest` is current.
          [ -z "$status" ] && echo "no image run for this commit" && exit 0
          case "$status" in
            "completed success"*) echo "image published" && exit 0 ;;
            completed*) echo "image run did not succeed: $status" && exit 1 ;;
          esac
          echo "image run in progress ($status), waiting..."
          sleep 15
        done
        echo "timed out waiting for the image workflow" && exit 1

  build:
    needs: wait-for-image
    runs-on: ubuntu-24.04
    container:
      image: ghcr.io/veltzer/demos-os-linux-ci:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
    - name: rsconstruct version
      run: rsconstruct version
    - name: trust the workspace dir
      # Container runs as root; checkout dir is owned by the runner user.
      # Modern git refuses to operate on a tree owned by a different uid
      # ("dubious ownership"). Mark all dirs safe inside the container.
      run: git config --global --add safe.directory '*'
    - uses: actions/checkout@v6
    - uses: actions/cache@v5
      with:
        path: .rsconstruct
        key: rsconstruct-${{ runner.os }}-${{ github.run_id }}
        restore-keys: |
          rsconstruct-${{ runner.os }}-
    - name: install language tools
      run: rsconstruct tools install
    - name: build
      # linux_module is excluded in CI: it builds against /lib/modules/$(uname -r)/build
      # which doesn't exist inside a container (no matching kernel headers for the host's
      # azure kernel). Run those demos on a real host.
      run: rsconstruct build -x linux_module
    - name: status
      run: rsconstruct status
