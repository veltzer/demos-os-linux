[dependencies]
system = [
	# X11 / OpenGL
	"libx11-dev",
	"libxrandr-dev",
	"libgl-dev",
	"libglu1-mesa-dev",
	"libglx-dev",
	# GUI toolkits used by examples
	"libgtk2.0-dev",
	"libgtkmm-2.4-dev",
	"libsigc++-2.0-dev",
	"libwxgtk3.2-dev",
	"qt6-base-dev",
	"qtbase5-dev",
	"libsdl1.2-dev",
	"libsdl2-dev",
	"libsdl-image1.2-dev",
	"libgl1-mesa-dev",
	"libglib2.0-dev",
	"libwayland-dev",
	# image / multimedia
	"libpng-dev",
	"libjpeg-dev",
	"libfftw3-dev",
	"libpulse-dev",
	# networking / system libs
	"libace-dev",
	"libevent-dev",
	"libnetfilter-queue-dev",
	"libpcap-dev",
	"libnl-3-dev",
	"libnl-genl-3-dev",
	"libnl-route-3-dev",
	# databases
	"libmysqlclient-dev",
	"libmysql++-dev",
	"libpq-dev",
	# logging / misc
	"liblog4cpp5-dev",
	"libdaemon-dev",
	"libiberty-dev",
	"libdialog-dev",
	# system-level
	"libncurses-dev",
	"libasound2-dev",
	"libcap-dev",
	"liburcu-dev",
	"libunwind-dev",
	"libdw-dev",
	"libelf-dev",
	"libsystemd-dev",
	"libcpufreq-dev",
	"libboost-all-dev",
	"libpapi-dev",
	"liburing-dev",
	"libaspell-dev",
	"libacl1-dev",
	"libattr1-dev",
	"libffi-dev",
	"libpopt-dev",
	"libxtables-dev",
	"libdmalloc-dev",
	"electric-fence",
	"libcds-dev",
	"binutils-dev",
	"systemtap-sdt-dev",
	"libreadline-dev",
	"libssl-dev",
	"libnuma-dev",
	"liblttng-ust-dev",
	# build helpers used by per-example Makefiles
	"uncrustify",
	"indent",
	"valgrind",
	# aarch64 cross compiler for src/examples_standalone/cross_compilation
	"gcc-aarch64-linux-gnu",
	# tools referenced by example Makefiles to demonstrate observability,
	# linking, and ELF concepts
	"strace",
	"ltrace",
	"gdb",
	"tcpdump",
	"netcat-openbsd",
	"flex",
	"patch",
	# spell-check dictionary used by the zspell processor
	"hunspell-en-us",
]

[vars]
kernel_excludes = [
  "/kernel/",
  "/kernel_standalone/"
]
no_single_excludes = [
  "/kernel/",
  "/kernel_standalone/",
  "/examples_standalone/",
  "/exercises_standalone/"
]
no_single_excludes_clang = [
  "/kernel/",
  "/kernel_standalone/",
  "/examples_standalone/",
  "/exercises_standalone/",
  "/openmp/"
]
no_single_excludes_clang_tidy = [
  "/kernel/",
  "/kernel_standalone/",
  "/examples_standalone/",
  "/exercises_standalone/",
  "/openmp/",
  "/libs/"
]

[processor.generator.cc_single_file.gcc]
src_dirs = ["src"]
src_exclude_dirs = "${no_single_excludes}"
include_paths = ["src/include"]
cc = "gcc"
cxx = "g++"
output_suffix = ".elf"
cflags = [
	"-O2",
	"-Wall",
	"-Werror",
	"-Wextra",
	"-pedantic",
]
cxxflags = [
	"-O2",
	"-Wall",
	"-Werror",
	"-Wextra",
	"-pedantic",
]

[processor.generator.cc_single_file.clang]
src_dirs = ["src"]
src_exclude_dirs = "${no_single_excludes_clang}"
src_exclude_paths = [
	"src/examples/compiler_internals/varargs_size.cc",
	"src/examples/dynamic_linking/dlsym.cc",
	"src/examples/error_handling/longjmp.cc",
	"src/examples/error_handling/longjmp_with_stack_trace.cc",
	"src/examples/internationalization/wide_override.cc",
	"src/examples/memory_allocation/mcheck_free.cc",
	"src/examples/performance/instrument.cc",
	"src/examples/preprocessor/messages_during_compilation.cc",
]
include_paths = ["src/include"]
cc = "clang"
cxx = "clang++"
cflags = [
	# Ubuntu 26.04 ships a prerelease gcc-16 tree alongside gcc-15, and clang
	# picks the highest-numbered one - but only gcc-15 ships libstdc++.so, so
	# the link fails with "cannot find -lstdc++". Pin clang to the gcc-15 tree,
	# which is the one g++ itself uses.
	"--gcc-install-dir=/usr/lib/gcc/x86_64-linux-gnu/15",
	"-O2",
	"-Wall",
	"-Werror",
	"-Wextra",
	"-pedantic",
]
cxxflags = [
	"--gcc-install-dir=/usr/lib/gcc/x86_64-linux-gnu/15",
	"-O2",
	"-Wall",
	"-Werror",
	"-Wextra",
	"-pedantic",
]

[processor.checker.cppcheck]
src_dirs = ["src", "misc/patch_and_diff"]
src_exclude_dirs = "${kernel_excludes}"
args = [
	"--error-exitcode=1",
	"--enable=warning,style,performance,portability",
	"--check-level=exhaustive",
	"--inline-suppr",
]

[processor.checker.make]
src_dirs = ["src"]
src_exclude_paths = ["Makefile"]
src_exclude_dirs = "${kernel_excludes}"

[analyzer.icpp]
src_exclude_dirs = "${kernel_excludes}"
include_paths = [
	"src/include",
	"/usr/include/mysql++",
	"/usr/lib/x86_64-linux-gnu/wx/include/gtk3-unicode-3.2",
	"/usr/include/wx-3.2",
	"src/examples_standalone/gcc_precompiled_headers/include",
	"src/examples_standalone/quoted_includes/folder1",
	"/usr/lib/gcc/x86_64-linux-gnu/15/plugin/include",
]
pkg_config = [
	"gtk+-2.0",
	"gtkmm-2.4",
	"mysqlclient",
	"Qt6Widgets",
]

[processor.checker.clang_tidy]
src_dirs = ["src"]
# The --gcc-install-dir pin is the same workaround as in cc_single_file.clang
# above: without it clang-tidy resolves against the prerelease gcc-16 tree,
# which ships no C++ headers, and every .cc fails with "'iostream' file not
# found".
compiler_args = [
	"-Isrc/include",
	"--gcc-install-dir=/usr/lib/gcc/x86_64-linux-gnu/15",
]
src_exclude_dirs = "${no_single_excludes_clang_tidy}"
src_exclude_paths = [
	"src/examples/compiler_internals/varargs_size.cc",
	"src/examples/dynamic_linking/dlsym.cc",
	"src/examples/error_handling/longjmp.cc",
	"src/examples/error_handling/longjmp_with_stack_trace.cc",
	"src/examples/internationalization/wide_override.cc",
	"src/examples/memory_allocation/mcheck_free.cc",
	"src/examples/performance/instrument.cc",
	"src/examples/preprocessor/messages_during_compilation.cc",
	"src/examples/multi_core/cache_line_pad.cc",
	"src/exercises/real_time/volatile_atomic_etc/solution.cc",
]

[processor.checker.cpplint]
src_dirs = ["src"]
src_exclude_dirs = "${kernel_excludes}"
args = ["--config=.cpplint"]
dep_inputs = [".cpplint"]

# Every C/C++ source starts with the project license (support/license_new.txt,
# which scripts/switch_license.py writes; keep the two in sync). Kernel
# sources put the SPDX line first. Same rule scripts/check_all.py and
# scripts/check_license.py used to apply, verified identical before the switch.
[processor.checker.license_header]
src_dirs = ["src", "misc"]
src_extensions = [".c", ".cc", ".h", ".hh", ".S"]
skip_shebang = false
optional_prefix_lines = ["// SPDX-License-Identifier: GPL-2.0"]
header_lines = [
    "/*",
    " * This file is part of the demos-os-linux package.",
    " * Copyright (C) 2011-2026 Mark Veltzer <mark.veltzer@gmail.com>",
    " *",
    " * demos-os-linux is free software: you can redistribute it and/or modify",
    " * it under the terms of the GNU General Public License as published by",
    " * the Free Software Foundation, either version 3 of the License, or",
    " * (at your option) any later version.",
    " *",
    " * demos-os-linux is distributed in the hope that it will be useful,",
    " * but WITHOUT ANY WARRANTY; without even the implied warranty of",
    " * MERCHANTABILITY or FITNESS FOR A PARTICULAR PURPOSE. See the",
    " * GNU General Public License for more details.",
    " *",
    " * You should have received a copy of the GNU General Public License",
    " * along with demos-os-linux. If not, see <http://www.gnu.org/licenses/>.",
    " */",
]

[processor.checker.rumdl]
src_dirs = ["src", "doc", "exercises_embedded", "misc"]
src_files = ["PLAN.md", "README.md"]

[processor.checker.zspell]
src_dirs = ["src"]

# [processor.checker.checkpatch]
# src_dirs = ["src/kernel"]
# args = ["--no-tree"]

[processor.creator.linux_module]
src_dirs = ["src/kernel_standalone"]

[processor.creator.cc]
src_dirs = ["src"]

[processor.checker.script.check_all]
enabled=false
command = "scripts/check_all.py"
src_extensions = [".c", ".cc"]
src_dirs = ["src"]
batch = true

[processor.checker.mypy]
src_dirs = ["scripts"]

[processor.checker.ruff]
src_dirs = ["scripts"]

[processor.checker.shellcheck]
src_dirs = ["src", "misc", "scripts"]

[processor.generator.tera]
src_dirs = ["tera.templates"]
dep_inputs = [
    "config/project.lua",
    "config/personal.lua",
    "config/version.lua",
]

[analyzer.markdown]

[analyzer.tera]

[analyzer.python]

[processor.checker.terms]
# The submodule moved from terms/ to shared/shared-terms, matching the layout
# teaching-syllabi and teaching-slides already use. The processor defaults to
# terms/unambiguous, so the new location has to be named explicitly.
dir_terms_unambiguous = "shared/shared-terms/unambiguous"
dir_terms_ambiguous = "shared/shared-terms/ambiguous"
src_dirs = [
  "src",
  "exercises_embedded",
  # "doc",
  "misc"
]

# lint the GitHub Actions workflow files with actionlint
[processor.checker.iactionlint]
src_dirs = [".github/workflows"]

# ─── yaml ────────────────────────────────────────────────────────────────────

[processor.checker.iyamllint]
src_dirs = ["src"]

# ─── docker ──────────────────────────────────────────────────────────────────

[processor.checker.hadolint]
src_files = ["Dockerfile"]

# ─── lua ─────────────────────────────────────────────────────────────────────

[processor.checker.luacheck]
src_dirs = ["config"]

# ─── html ────────────────────────────────────────────────────────────────────

[processor.checker.itidy]
src_dirs = ["docs", "support"]
