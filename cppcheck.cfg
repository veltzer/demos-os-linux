<?xml version="1.0"?>
<def format="2">
  <!-- Functions called from outside what cppcheck sees; one line each saying who calls them. -->

  <!-- examples_standalone/audit: the dynamic linker (rtld-audit) calls these by name -->
  <entrypoint name="la_version"/>
  <entrypoint name="la_objsearch"/>
  <entrypoint name="la_activity"/>
  <entrypoint name="la_objopen"/>
  <entrypoint name="la_objclose"/>
  <entrypoint name="la_preinit"/>
  <entrypoint name="la_symbind32"/>
  <entrypoint name="la_i86_gnu_pltenter"/>
  <entrypoint name="la_symbind64"/>

  <!-- examples_standalone/crash_handling: API of the crash library, called by the programs that include crash.h -->
  <entrypoint name="crash_dump"/>
  <entrypoint name="crash_dump_thread"/>

  <!-- examples_standalone/dlopen_basic: looked up with dlsym(3) in main.c -->
  <entrypoint name="dlopen_demo_func"/>

  <!-- examples_standalone/DSO_vs_static_speed: function of a shared library, called by the program that loads it -->
  <entrypoint name="dso_function"/>

  <!-- examples/compiler_internals/weak_symbols and examples_standalone/g++_vtables: only inspected by symbol name (nm) -->
  <entrypoint name="weak_symbols_demo_foo"/>
  <entrypoint name="vtables_demo_foo"/>

  <!-- examples_standalone/gcc_plugin: gcc calls the plugin entry point by name -->
  <entrypoint name="plugin_init"/>

  <!-- examples_standalone/lib_init_fini_old: the dynamic linker runs these as the library init/fini -->
  <entrypoint name="foo_lib_init"/>
  <entrypoint name="foo_lib_fini"/>
  <entrypoint name="bar_lib_init"/>
  <entrypoint name="bar_lib_fini"/>

  <!-- examples_standalone/lib_linking_with_debug: shared library function, called by programs that load the library -->
  <entrypoint name="linking_demo_use"/>

  <!-- examples_standalone/lib_making_library_executable: linked as the ELF entry point (--entry=mymain) -->
  <entrypoint name="mymain"/>

  <!-- examples_standalone/lib_undefined_symbols and objcopy_add_files_to_libraries: library functions called by programs that load the library -->
  <entrypoint name="wrap_sqrt"/>
  <entrypoint name="mysin"/>

  <!-- examples_standalone/override_throw: replaces the C++ runtime __cxa_throw, called by every throw -->
  <entrypoint name="__cxa_throw"/>

  <!-- examples_standalone/templates_explicit_instantiation_advanced: only compiled to objects, inspected with nm -->
  <entrypoint name="advanced_bar_implicit"/>
  <entrypoint name="advanced_zoo_explicit"/>

  <!-- examples/atomics, examples/compiler_internals, examples/memory_allocation: disassembled or inspected by name (disassemble_function(), nm) -->
  <entrypoint name="do_volatile"/>
  <entrypoint name="do_regular"/>
  <entrypoint name="do_atomic"/>
  <entrypoint name="sum_not_optimized"/>
  <entrypoint name="sum_optimized"/>
  <entrypoint name="sum_print_opt"/>
  <entrypoint name="cpp_style_add"/>
  <entrypoint name="my_calloc"/>
  <entrypoint name="my_realloc"/>
  <entrypoint name="my_malloc"/>
  <entrypoint name="my_free"/>

  <!-- examples/memory_allocation/obstack.cc: named by the obstack_chunk_alloc macro, expanded inside obstack.h -->
  <entrypoint name="xmalloc"/>
</def>
